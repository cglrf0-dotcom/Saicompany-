<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Builder</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f4f4f5;font-family:Inter,Arial,sans-serif}
.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:#111113;border-right:1px solid #27272a;padding:22px}.brand{font-size:20px;font-weight:800;margin-bottom:32px}.nav div{padding:11px 12px;margin:4px 0;border-radius:9px;color:#a1a1aa}.nav .active{background:#27272a;color:#fff}
main{max-width:1200px;width:100%;padding:36px;margin:auto}h1{font-size:36px;margin:0 0 8px}.sub{color:#a1a1aa;margin:0 0 28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#111113;border:1px solid #27272a;border-radius:14px;padding:20px}.full{grid-column:1/-1}
textarea{width:100%;height:170px;background:#09090b;color:#fff;border:1px solid #3f3f46;border-radius:10px;padding:14px;resize:vertical;outline:0}
textarea:focus{border-color:#71717a}.buttons{display:flex;gap:10px;margin-top:12px}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;background:#fff;color:#09090b}.btn.alt{background:#27272a;color:#fff}.btn:disabled{opacity:.5}
pre{white-space:pre-wrap;overflow:auto;max-height:500px;background:#09090b;border:1px solid #27272a;border-radius:10px;padding:15px;font-size:12px;line-height:1.55}
.badge{display:inline-block;background:#27272a;border-radius:999px;padding:5px 9px;font-size:12px;color:#d4d4d8}.status{color:#a1a1aa;font-size:13px;margin-top:12px}
@media(max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:1fr}.full{grid-column:auto}main{padding:20px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">⚡ App Builder</div>
  <div class="nav">
    <div class="active">Builder</div><div>Blueprint</div><div>Database</div><div>Pages</div><div>Workflows</div>
  </div>
</aside>
<main>
  <span class="badge">HTML · Sin dependencias</span>
  <h1>Crea una aplicación</h1>
  <p class="sub">Describe lo que quieres construir y genera el Blueprint y SQL inicial.</p>

  <div class="grid">
    <section class="card">
      <h2>Describe tu aplicación</h2>
      <textarea id="prompt">Crea una app de inventario con productos, categorías, proveedores y ventas.</textarea>
      <div class="buttons">
        <button class="btn" onclick="generate()">⚡ Generar</button>
        <button class="btn alt" onclick="clearAll()">Limpiar</button>
      </div>
      <div id="status" class="status"></div>
    </section>

    <section class="card">
      <h2>App Blueprint</h2>
      <pre id="blueprint">// Pulsa "Generar"</pre>
      <button class="btn alt" onclick="copyText('blueprint')">Copiar Blueprint</button>
    </section>

    <section class="card full">
      <h2>PostgreSQL</h2>
      <pre id="sql">-- El SQL aparecerá aquí.</pre>
      <div class="buttons">
        <button class="btn alt" onclick="copyText('sql')">Copiar SQL</button>
        <button class="btn alt" onclick="downloadSQL()">Descargar SQL</button>
      </div>
    </section>
  </div>
</main>
</div>

<script>
const stopwords=new Set(["crea","crear","para","una","app","con","los","las","del","una","administrar","gestionar","sistema","aplicación","aplicacion","que","por","de","y","en"]);

function slug(s){return s.toLowerCase().normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")}
function unique(a){return [...new Set(a)]}

function generate(){
  const prompt=document.getElementById("prompt").value.trim();
  if(!prompt){document.getElementById("status").textContent="Escribe una descripción.";return}
  const words=prompt.match(/[A-Za-zÁÉÍÓÚáéíóúÑñ]{4,}/g)||[];
  let nouns=unique(words.map(slug).filter(x=>!stopwords.has(x))).slice(0,8);
  if(!nouns.length)nouns=["items"];

  const entities=nouns.map((n,i)=>{
    const name=n.endsWith("s")?n:n+"s";
    return {
      name,
      fields:[
        {name:"id",type:"uuid",primaryKey:true,generated:true},
        {name:"name",type:"text",required:true},
        {name:"created_at",type:"timestamp",default:"now()"}
      ],
      relations:[]
    };
  });

  const pages=[
    {name:"Dashboard",route:"/",components:["StatsCards","RecentActivity"]},
    ...entities.slice(0,5).map(e=>({
      name:e.name.charAt(0).toUpperCase()+e.name.slice(1),
      route:"/"+e.name,
      components:["DataTable","Form","Search"]
    }))
  ];

  const blueprint={
    version:"1.0",
    metadata:{name:nouns.slice(0,5).join(" "),description:prompt},
    database:{entities},
    pages,
    auth:{enabled:true,providers:["email"],roles:["user","admin"]}
  };

  const sql=[
    "-- Generated by App Builder",
    "CREATE EXTENSION IF NOT EXISTS pgcrypto;",
    ...entities.map(e=>{
      const fields=e.fields.map(f=>{
        let type={uuid:"UUID",text:"TEXT",timestamp:"TIMESTAMPTZ"}[f.type]||"TEXT";
        let x='"'+f.name+'" '+type;
        if(f.generated&&f.type==="uuid")x+=" DEFAULT gen_random_uuid()";
        else if(f.default)x+=" DEFAULT "+f.default;
        if(f.primaryKey)x+=" PRIMARY KEY";
        if(f.required&&!f.primaryKey)x+=" NOT NULL";
        return "  "+x;
      });
      return 'CREATE TABLE "'+e.name+'" (\\n'+fields.join(",\\n")+"\\n);";
    })
  ].join("\\n\\n");

  document.getElementById("blueprint").textContent=JSON.stringify(blueprint,null,2);
  document.getElementById("sql").textContent=sql;
  document.getElementById("status").textContent="✓ Aplicación generada";
}

function clearAll(){
  document.getElementById("prompt").value="";
  document.getElementById("blueprint").textContent="// Pulsa Generar";
  document.getElementById("sql").textContent="-- El SQL aparecerá aquí.";
  document.getElementById("status").textContent="";
}

async function copyText(id){
  await navigator.clipboard.writeText(document.getElementById(id).textContent);
  document.getElementById("status").textContent="✓ Copiado al portapapeles";
}

function downloadSQL(){
  const blob=new Blob([document.getElementById("sql").textContent],{type:"text/sql"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="schema.sql";a.click();
  URL.revokeObjectURL(a.href);
}

generate();
</script>
</body>
</html>
